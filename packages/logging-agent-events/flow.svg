<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" role="img" aria-label="What happens when an agent logs its events" style="max-width:100%;height:auto;color:#e6e6e6;font-family:system-ui,sans-serif"><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e06666"/></marker></defs><rect x="0" y="0" width="1120" height="450" fill="#111"/><text x="20" y="34" font-size="16" font-weight="bold" fill="currentColor">What happens when an agent logs its events</text><rect x="20" y="70" width="180" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="110.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">1. Agent runs a tool</text><text x="110.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">read, edit, shell,</text><text x="110.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">subagent, web</text><rect x="245" y="70" width="180" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="335.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">2. Hook after every call</text><text x="335.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">async, timeout 10 s,</text><text x="335.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">never blocks the agent</text><rect x="470" y="70" width="180" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="560.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">3. Log script</text><text x="560.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">mask secrets, cut to 200/2000</text><text x="560.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">chars, add who + session</text><rect x="695" y="70" width="180" height="56" rx="10" fill="#a07cc5" fill-opacity="0.16" stroke="#a07cc5" stroke-width="1.6"/><text x="785.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">4. Event log</text><text x="785.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">one local SQLite file,</text><text x="785.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">one row per event</text><polyline points="200,98.0 245,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="425,98.0 470,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="650,98.0 695,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><rect x="470" y="195" width="180" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6" stroke-dasharray="5 4"/><text x="560.0" y="211.0" text-anchor="middle" font-size="12" fill="currentColor">Agent logs itself</text><text x="560.0" y="227.0" text-anchor="middle" font-size="12" fill="currentColor">a decision, blocker</text><text x="560.0" y="243.0" text-anchor="middle" font-size="12" fill="currentColor">or milestone</text><polyline points="560.0,195 560.0,126" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ma)"/><text x="568.0" y="185" text-anchor="start" font-size="10.5" fill="currentColor">deliberate</text><polyline points="785.0,126 785.0,195" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><text x="793.0" y="185" text-anchor="start" font-size="10.5" fill="currentColor">read</text><rect x="695" y="195" width="180" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"/><text x="785.0" y="211.0" text-anchor="middle" font-size="12" fill="currentColor">Read script</text><text x="785.0" y="227.0" text-anchor="middle" font-size="12" fill="currentColor">fixed queries,</text><text x="785.0" y="243.0" text-anchor="middle" font-size="12" fill="currentColor">no ad-hoc SQL</text><polyline points="785.0,251 785.0,320" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><rect x="695" y="320" width="180" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"/><text x="785.0" y="336.0" text-anchor="middle" font-size="12" fill="currentColor">Session start: where were we</text><text x="785.0" y="352.0" text-anchor="middle" font-size="12" fill="currentColor">Audit: what did it do</text><text x="785.0" y="368.0" text-anchor="middle" font-size="12" fill="currentColor">Failures, improvement list</text><polyline points="875,98.0 920,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><text x="897.5" y="91.0" text-anchor="middle" font-size="10.5" fill="currentColor">prune</text><rect x="920" y="70" width="180" height="56" rx="10" fill="#d6a92b" fill-opacity="0.16" stroke="#d6a92b" stroke-width="1.6"/><text x="1010.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Cleanup by level</text><text x="1010.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">triggers: age, size,</text><text x="1010.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">one source over ~20 %</text><polyline points="1010.0,126 1010.0,195" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><rect x="920" y="195" width="180" height="56" rx="10" fill="#d6a92b" fill-opacity="0.16" stroke="#d6a92b" stroke-width="1.6"/><text x="1010.0" y="211.0" text-anchor="middle" font-size="12" fill="currentColor">Backup first,</text><text x="1010.0" y="227.0" text-anchor="middle" font-size="12" fill="currentColor">dry run,</text><text x="1010.0" y="243.0" text-anchor="middle" font-size="12" fill="currentColor">then delete</text><rect x="920" y="320" width="180" height="56" rx="10" fill="#9e9e9e" fill-opacity="0.16" stroke="#9e9e9e" stroke-width="1.6" stroke-dasharray="5 4"/><text x="1010.0" y="336.0" text-anchor="middle" font-size="12" fill="currentColor">Verbose / progress</text><text x="1010.0" y="352.0" text-anchor="middle" font-size="12" fill="currentColor">output goes to a plain</text><text x="1010.0" y="368.0" text-anchor="middle" font-size="12" fill="currentColor">log file</text><text x="1010.0" y="394" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">never into the event log</text><rect x="20" y="195" width="180" height="56" rx="10" fill="#e06666" fill-opacity="0.16" stroke="#e06666" stroke-width="1.6"/><text x="110.0" y="211.0" text-anchor="middle" font-size="12" fill="currentColor">Without this:</text><text x="110.0" y="227.0" text-anchor="middle" font-size="12" fill="currentColor">&quot;remember to log&quot; is</text><text x="110.0" y="243.0" text-anchor="middle" font-size="12" fill="currentColor">forgotten under pressure</text><text x="110.0" y="269" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">no audit trail,</text><text x="110.0" y="283" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">no &quot;where were we&quot;</text><rect x="20" y="415" width="14" height="14" rx="3" fill="#4caf6e" fill-opacity="0.3" stroke="#4caf6e"/><text x="40" y="426" font-size="11" fill="currentColor">agent or script</text><rect x="149.0" y="415" width="14" height="14" rx="3" fill="#a07cc5" fill-opacity="0.3" stroke="#a07cc5"/><text x="169.0" y="426" font-size="11" fill="currentColor">storage</text><rect x="225.2" y="415" width="14" height="14" rx="3" fill="#5b9bd5" fill-opacity="0.3" stroke="#5b9bd5"/><text x="245.2" y="426" font-size="11" fill="currentColor">reader</text><rect x="294.79999999999995" y="415" width="14" height="14" rx="3" fill="#d6a92b" fill-opacity="0.3" stroke="#d6a92b"/><text x="314.79999999999995" y="426" font-size="11" fill="currentColor">cleanup</text><rect x="370.99999999999994" y="415" width="14" height="14" rx="3" fill="#e06666" fill-opacity="0.3" stroke="#e06666"/><text x="390.99999999999994" y="426" font-size="11" fill="currentColor">what it prevents</text><rect x="506.5999999999999" y="415" width="14" height="14" rx="3" fill="#9e9e9e" fill-opacity="0.3" stroke="#9e9e9e"/><text x="526.5999999999999" y="426" font-size="11" fill="currentColor">kept out of the log</text><line x1="662.0" y1="422" x2="692.0" y2="422" stroke="currentColor" stroke-dasharray="5 4"/><text x="698.0" y="426" font-size="11" fill="currentColor">deliberate or optional</text></svg>
