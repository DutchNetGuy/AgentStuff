<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-label="What happens when you use it-leader" style="max-width:100%;height:auto;color:#e6e6e6;font-family:system-ui,sans-serif"><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e06666"/></marker></defs><rect x="0" y="0" width="800" height="490" fill="#111"/><rect x="20" y="70" width="160" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"/><text x="100.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Caller</text><text x="100.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">writes a problem</text><text x="100.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">analysis</text><rect x="220" y="70" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="300.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">it-leader agent</text><text x="300.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">read-only tools</text><text x="300.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">one-shot run</text><rect x="420" y="70" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="500.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Tests the analysis</text><text x="500.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">constraint, work types,</text><text x="500.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">WIP, change, ways</text><rect x="620" y="70" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="700.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Five-part verdict</text><text x="700.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">gaps with evidence,</text><text x="700.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">no solutions</text><rect x="20" y="340" width="160" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"/><text x="100.0" y="356.0" text-anchor="middle" font-size="12" fill="currentColor">Caller weighs it</text><text x="100.0" y="372.0" text-anchor="middle" font-size="12" fill="currentColor">and takes open</text><text x="100.0" y="388.0" text-anchor="middle" font-size="12" fill="currentColor">questions to the owner</text><rect x="220" y="340" width="160" height="56" rx="10" fill="#e06666" fill-opacity="0.16" stroke="#e06666" stroke-width="1.6"/><text x="300.0" y="356.0" text-anchor="middle" font-size="12" fill="currentColor">Without this:</text><text x="300.0" y="372.0" text-anchor="middle" font-size="12" fill="currentColor">the author reviews</text><text x="300.0" y="388.0" text-anchor="middle" font-size="12" fill="currentColor">their own framing</text><polyline points="180,98.0 220,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="380,98.0 420,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="580,98.0 620,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="780,98.0 794,98.0 794,300 8,300 8,368.0 20,368.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="300.0,126 300.0,195" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ma)"/><text x="308.0" y="185" text-anchor="middle" font-size="10.5" fill="currentColor">reads first</text><rect x="220" y="195" width="160" height="56" rx="10" fill="#a07cc5" fill-opacity="0.16" stroke="#a07cc5" stroke-width="1.6"/><text x="300.0" y="211.0" text-anchor="middle" font-size="12" fill="currentColor">Knowledge file</text><text x="300.0" y="227.0" text-anchor="middle" font-size="12" fill="currentColor">concepts with</text><text x="300.0" y="243.0" text-anchor="middle" font-size="12" fill="currentColor">CONFIRMED status</text><polyline points="500.0,126 500.0,195" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ma)"/><text x="508.0" y="185" text-anchor="middle" font-size="10.5" fill="currentColor">does not adopt</text><rect x="420" y="195" width="160" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"/><text x="500.0" y="211.0" text-anchor="middle" font-size="12" fill="currentColor">Caller&#x27;s framing</text><text x="500.0" y="227.0" text-anchor="middle" font-size="12" fill="currentColor">and advice are</text><text x="500.0" y="243.0" text-anchor="middle" font-size="12" fill="currentColor">input, not truth</text><text x="300.0" y="414" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">blind spots stay hidden,</text><text x="300.0" y="428" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">review only confirms</text><rect x="20" y="455" width="14" height="14" rx="3" fill="#5b9bd5" fill-opacity="0.3" stroke="#5b9bd5"/><text x="40" y="466" font-size="11" fill="currentColor">person or caller</text><rect x="155.6" y="455" width="14" height="14" rx="3" fill="#4caf6e" fill-opacity="0.3" stroke="#4caf6e"/><text x="175.6" y="466" font-size="11" fill="currentColor">agent</text><rect x="218.6" y="455" width="14" height="14" rx="3" fill="#a07cc5" fill-opacity="0.3" stroke="#a07cc5"/><text x="238.6" y="466" font-size="11" fill="currentColor">file it reads</text><rect x="334.4" y="455" width="14" height="14" rx="3" fill="#e06666" fill-opacity="0.3" stroke="#e06666"/><text x="354.4" y="466" font-size="11" fill="currentColor">what it prevents</text></svg>
