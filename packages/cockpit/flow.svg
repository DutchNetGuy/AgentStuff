<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-label="What happens when an agent publishes a page with cockpit" style="max-width:100%;height:auto;color:#e6e6e6;font-family:system-ui,sans-serif"><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e06666"/></marker></defs><rect x="0" y="0" width="800" height="490" fill="#111"/><rect x="20" y="70" width="160" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"/><text x="100.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Question</text><text x="100.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">that needs a long</text><text x="100.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">or structured answer</text><rect x="220" y="70" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="300.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Agent writes</text><text x="300.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">the content as HTML</text><text x="300.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">with readability classes</text><rect x="420" y="70" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="500.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">new_artifact script</text><text x="500.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">page + manifest entry</text><text x="500.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">atomic write</text><rect x="620" y="70" width="160" height="56" rx="10" fill="#a07cc5" fill-opacity="0.16" stroke="#a07cc5" stroke-width="1.6"/><text x="700.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Static web server</text><text x="700.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">serves site/</text><text x="700.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">no backend</text><rect x="20" y="340" width="160" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"/><text x="100.0" y="364.0" text-anchor="middle" font-size="12" fill="currentColor">User opens</text><text x="100.0" y="380.0" text-anchor="middle" font-size="12" fill="currentColor">the cockpit shell</text><rect x="220" y="340" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="300.0" y="356.0" text-anchor="middle" font-size="12" fill="currentColor">Shell reads</text><text x="300.0" y="372.0" text-anchor="middle" font-size="12" fill="currentColor">artifacts.json</text><text x="300.0" y="388.0" text-anchor="middle" font-size="12" fill="currentColor">newest first, badge</text><rect x="420" y="340" width="160" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"/><text x="500.0" y="356.0" text-anchor="middle" font-size="12" fill="currentColor">User picks a page,</text><text x="500.0" y="372.0" text-anchor="middle" font-size="12" fill="currentColor">reads it in the</text><text x="500.0" y="388.0" text-anchor="middle" font-size="12" fill="currentColor">focus panel</text><rect x="620" y="340" width="160" height="56" rx="10" fill="#e06666" fill-opacity="0.16" stroke="#e06666" stroke-width="1.6"/><text x="700.0" y="356.0" text-anchor="middle" font-size="12" fill="currentColor">Without this tool:</text><text x="700.0" y="372.0" text-anchor="middle" font-size="12" fill="currentColor">a wall of text</text><text x="700.0" y="388.0" text-anchor="middle" font-size="12" fill="currentColor">scrolls by in chat</text><polyline points="180,98.0 220,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="380,98.0 420,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="580,98.0 620,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="780,98.0 794,98.0 794,300 8,300 8,368.0 20,368.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="180,368.0 220,368.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="380,368.0 420,368.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="300.0,126 300.0,195" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ma)"/><rect x="220" y="195" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6" stroke-dasharray="5 4"/><text x="300.0" y="211.0" text-anchor="middle" font-size="12" fill="currentColor">.id  .kw  .question</text><text x="300.0" y="227.0" text-anchor="middle" font-size="12" fill="currentColor">identifiers, keyword,</text><text x="300.0" y="243.0" text-anchor="middle" font-size="12" fill="currentColor">question to the reader</text><polyline points="500.0,126 500.0,195" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ma)"/><rect x="420" y="195" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6" stroke-dasharray="5 4"/><text x="500.0" y="211.0" text-anchor="middle" font-size="12" fill="currentColor">&lt;slug&gt;.html</text><text x="500.0" y="227.0" text-anchor="middle" font-size="12" fill="currentColor">+ artifacts.json</text><text x="500.0" y="243.0" text-anchor="middle" font-size="12" fill="currentColor">{slug,title,file,generated}</text><polyline points="700.0,126 700.0,195" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ma)"/><rect x="620" y="195" width="160" height="56" rx="10" fill="#a07cc5" fill-opacity="0.16" stroke="#a07cc5" stroke-width="1.6" stroke-dasharray="5 4"/><text x="700.0" y="211.0" text-anchor="middle" font-size="12" fill="currentColor">nginx, http.server,</text><text x="700.0" y="227.0" text-anchor="middle" font-size="12" fill="currentColor">any file host;</text><text x="700.0" y="243.0" text-anchor="middle" font-size="12" fill="currentColor">put access rules here</text><text x="500.0" y="414" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">export as .html or open in a new tab</text><text x="700.0" y="414" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">cannot be scanned, compared</text><text x="700.0" y="428" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">or found back later</text><rect x="20" y="455" width="14" height="14" rx="3" fill="#5b9bd5" fill-opacity="0.3" stroke="#5b9bd5"/><text x="40" y="466" font-size="11" fill="currentColor">person</text><rect x="89.6" y="455" width="14" height="14" rx="3" fill="#4caf6e" fill-opacity="0.3" stroke="#4caf6e"/><text x="109.6" y="466" font-size="11" fill="currentColor">agent or script</text><rect x="218.6" y="455" width="14" height="14" rx="3" fill="#a07cc5" fill-opacity="0.3" stroke="#a07cc5"/><text x="238.6" y="466" font-size="11" fill="currentColor">web server</text><rect x="314.6" y="455" width="14" height="14" rx="3" fill="#e06666" fill-opacity="0.3" stroke="#e06666"/><text x="334.6" y="466" font-size="11" fill="currentColor">what it prevents</text><line x1="450.2" y1="462" x2="480.2" y2="462" stroke="currentColor" stroke-dasharray="5 4"/><text x="486.2" y="466" font-size="11" fill="currentColor">detail or depends on</text></svg>
