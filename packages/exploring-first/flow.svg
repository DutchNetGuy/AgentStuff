<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-label="What happens when an agent uses exploring-first" style="max-width:100%;height:auto;color:#e6e6e6;font-family:system-ui,sans-serif"><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e06666"/></marker></defs><rect x="0" y="0" width="800" height="490" fill="#111"/><rect x="20" y="70" width="160" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"/><text x="100.0" y="94.0" text-anchor="middle" font-size="12" fill="currentColor">Question</text><text x="100.0" y="110.0" text-anchor="middle" font-size="12" fill="currentColor">from the owner</text><polygon points="220.0,98.0 300.0,64.0 380.0,98.0 300.0,132.0" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="300.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">3+ tool calls?</text><rect x="420" y="70" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="500.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Explore subagent</text><text x="500.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">gathers: what,</text><text x="500.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">where, how</text><rect x="620" y="70" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="700.0" y="94.0" text-anchor="middle" font-size="12" fill="currentColor">Raw findings</text><text x="700.0" y="110.0" text-anchor="middle" font-size="12" fill="currentColor">no conclusions</text><rect x="20" y="340" width="160" height="56" rx="10" fill="#d6a92b" fill-opacity="0.16" stroke="#d6a92b" stroke-width="1.6"/><text x="100.0" y="356.0" text-anchor="middle" font-size="12" fill="currentColor">Pause</text><text x="100.0" y="372.0" text-anchor="middle" font-size="12" fill="currentColor">owner reads,</text><text x="100.0" y="388.0" text-anchor="middle" font-size="12" fill="currentColor">gives go-ahead</text><rect x="220" y="340" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="300.0" y="356.0" text-anchor="middle" font-size="12" fill="currentColor">Main agent</text><text x="300.0" y="372.0" text-anchor="middle" font-size="12" fill="currentColor">analyses and</text><text x="300.0" y="388.0" text-anchor="middle" font-size="12" fill="currentColor">concludes</text><rect x="420" y="340" width="160" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"/><text x="500.0" y="356.0" text-anchor="middle" font-size="12" fill="currentColor">Answer</text><text x="500.0" y="372.0" text-anchor="middle" font-size="12" fill="currentColor">data and conclusion</text><text x="500.0" y="388.0" text-anchor="middle" font-size="12" fill="currentColor">kept apart</text><rect x="620" y="340" width="160" height="56" rx="10" fill="#e06666" fill-opacity="0.16" stroke="#e06666" stroke-width="1.6"/><text x="700.0" y="356.0" text-anchor="middle" font-size="12" fill="currentColor">Without this skill:</text><text x="700.0" y="372.0" text-anchor="middle" font-size="12" fill="currentColor">gathering + concluding</text><text x="700.0" y="388.0" text-anchor="middle" font-size="12" fill="currentColor">in one response</text><polyline points="180,98.0 220,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="380,98.0 420,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><text x="399" y="91.0" text-anchor="middle" font-size="10.5" fill="currentColor">yes</text><polyline points="580,98.0 620,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="780,98.0 794,98.0 794,300 8,300 8,368.0 20,368.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="180,368.0 220,368.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="380,368.0 420,368.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="300.0,132.0 300.0,195" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><text x="308.0" y="185" text-anchor="start" font-size="10.5" fill="currentColor">no</text><rect x="220" y="195" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="300.0" y="211.0" text-anchor="middle" font-size="12" fill="currentColor">Answer directly</text><text x="300.0" y="227.0" text-anchor="middle" font-size="12" fill="currentColor">single read,</text><text x="300.0" y="243.0" text-anchor="middle" font-size="12" fill="currentColor">known fact</text><polyline points="500.0,126 500.0,195" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ma)"/><text x="508.0" y="185" text-anchor="start" font-size="10.5" fill="currentColor">reads only</text><rect x="420" y="195" width="160" height="56" rx="10" fill="#a07cc5" fill-opacity="0.16" stroke="#a07cc5" stroke-width="1.6"/><text x="500.0" y="211.0" text-anchor="middle" font-size="12" fill="currentColor">Sources</text><text x="500.0" y="227.0" text-anchor="middle" font-size="12" fill="currentColor">tracker, docs,</text><text x="500.0" y="243.0" text-anchor="middle" font-size="12" fill="currentColor">knowledge base, web</text><polyline points="700.0,126 700.0,195" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ma)"/><text x="692.0" y="185" text-anchor="end" font-size="10.5" fill="currentColor">if the result persists</text><rect x="620" y="195" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6" stroke-dasharray="5 4"/><text x="700.0" y="211.0" text-anchor="middle" font-size="12" fill="currentColor">Factcheck subagent</text><text x="700.0" y="227.0" text-anchor="middle" font-size="12" fill="currentColor">checks claims against</text><text x="700.0" y="243.0" text-anchor="middle" font-size="12" fill="currentColor">the primary source</text><text x="700.0" y="414" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">premature conclusions,</text><text x="700.0" y="428" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">owner cannot weigh the data</text><rect x="20" y="455" width="14" height="14" rx="3" fill="#5b9bd5" fill-opacity="0.3" stroke="#5b9bd5"/><text x="40" y="466" font-size="11" fill="currentColor">person</text><rect x="89.6" y="455" width="14" height="14" rx="3" fill="#4caf6e" fill-opacity="0.3" stroke="#4caf6e"/><text x="109.6" y="466" font-size="11" fill="currentColor">agent or subagent</text><rect x="231.79999999999998" y="455" width="14" height="14" rx="3" fill="#d6a92b" fill-opacity="0.3" stroke="#d6a92b"/><text x="251.79999999999998" y="466" font-size="11" fill="currentColor">waiting</text><rect x="308.0" y="455" width="14" height="14" rx="3" fill="#a07cc5" fill-opacity="0.3" stroke="#a07cc5"/><text x="328.0" y="466" font-size="11" fill="currentColor">external source</text><rect x="437.0" y="455" width="14" height="14" rx="3" fill="#e06666" fill-opacity="0.3" stroke="#e06666"/><text x="457.0" y="466" font-size="11" fill="currentColor">what it prevents</text><line x1="572.5999999999999" y1="462" x2="602.5999999999999" y2="462" stroke="currentColor" stroke-dasharray="5 4"/><text x="608.5999999999999" y="466" font-size="11" fill="currentColor">optional or depends on</text></svg>
