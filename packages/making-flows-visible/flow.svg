<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 402" role="img" aria-label="What happens when you make a flow visible with making-flows-visible" style="max-width:100%;height:auto;color:#e6e6e6;font-family:system-ui,sans-serif"><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e06666"/></marker></defs><rect x="0" y="0" width="800" height="402" fill="#111"/><rect x="20" y="70" width="160" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"/><text x="100.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Owner describes</text><text x="100.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">the flow in plain</text><text x="100.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">words, step by step</text><rect x="220" y="70" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="300.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Agent fills the</text><text x="300.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">model JSON: steps,</text><text x="300.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">hours, dependencies</text><rect x="420" y="70" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="500.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Run the generator</text><text x="500.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">it checks the JSON</text><text x="500.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">writes the data file</text><polygon points="638.0,98.0 700.0,64.0 762.0,98.0 700.0,132.0" fill="#9e9e9e" fill-opacity="0.16" stroke="#9e9e9e" stroke-width="1.6"/><text x="700.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">Model valid?</text><rect x="20" y="230" width="160" height="56" rx="10" fill="#a07cc5" fill-opacity="0.16" stroke="#a07cc5" stroke-width="1.6"/><text x="100.0" y="246.0" text-anchor="middle" font-size="12" fill="currentColor">Open the board</text><text x="100.0" y="262.0" text-anchor="middle" font-size="12" fill="currentColor">bars, chips,</text><text x="100.0" y="278.0" text-anchor="middle" font-size="12" fill="currentColor">timeline per flow</text><rect x="220" y="230" width="160" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"/><text x="300.0" y="246.0" text-anchor="middle" font-size="12" fill="currentColor">Owner sees the</text><text x="300.0" y="262.0" text-anchor="middle" font-size="12" fill="currentColor">bottleneck: waiting</text><text x="300.0" y="278.0" text-anchor="middle" font-size="12" fill="currentColor">and single points</text><rect x="420" y="230" width="160" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"/><text x="500.0" y="246.0" text-anchor="middle" font-size="12" fill="currentColor">Decide what to</text><text x="500.0" y="262.0" text-anchor="middle" font-size="12" fill="currentColor">share or automate</text><text x="500.0" y="278.0" text-anchor="middle" font-size="12" fill="currentColor">first</text><rect x="620" y="230" width="160" height="56" rx="10" fill="#e06666" fill-opacity="0.16" stroke="#e06666" stroke-width="1.6"/><text x="700.0" y="246.0" text-anchor="middle" font-size="12" fill="currentColor">Without it: a drawing</text><text x="700.0" y="262.0" text-anchor="middle" font-size="12" fill="currentColor">shows a picture, not</text><text x="700.0" y="278.0" text-anchor="middle" font-size="12" fill="currentColor">who alone knows what</text><polyline points="180.0,98.0 220.0,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="380.0,98.0 420.0,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="580.0,98.0 638.0,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="700.0,132.0 700.0,148 300.0,148 300.0,126.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><text x="500.0" y="143" text-anchor="middle" font-size="10.5" fill="currentColor">no</text><polyline points="762.0,98.0 776.0,98.0 776.0,190 8,190 8,258.0 20.0,258.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><text x="781.0" y="91.0" text-anchor="start" font-size="10.5" fill="currentColor">yes</text><polyline points="180.0,258.0 220.0,258.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="380.0,258.0 420.0,258.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><text x="300.0" y="302" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">single point = exactly one</text><text x="300.0" y="316" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">person or agent knows it</text><text x="700.0" y="302" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">the drawing alone hides it</text><rect x="20" y="343" width="14" height="14" rx="3" fill="#5b9bd5" fill-opacity="0.3" stroke="#5b9bd5"/><text x="40" y="354" font-size="11" fill="currentColor">owner</text><rect x="83.0" y="343" width="14" height="14" rx="3" fill="#4caf6e" fill-opacity="0.3" stroke="#4caf6e"/><text x="103.0" y="354" font-size="11" fill="currentColor">agent or script</text><rect x="212.0" y="343" width="14" height="14" rx="3" fill="#a07cc5" fill-opacity="0.3" stroke="#a07cc5"/><text x="232.0" y="354" font-size="11" fill="currentColor">board page</text><rect x="308.0" y="343" width="14" height="14" rx="3" fill="#e06666" fill-opacity="0.3" stroke="#e06666"/><text x="328.0" y="354" font-size="11" fill="currentColor">what it prevents</text><text x="20" y="378" font-size="11" fill="currentColor">decision by:</text><polygon points="113.19999999999999,374 121.19999999999999,366 129.2,374 121.19999999999999,382" fill="#9e9e9e" fill-opacity="0.3" stroke="#9e9e9e"/><text x="135.2" y="378" font-size="11" fill="currentColor">rule</text></svg>
