<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow overview</title>
<style>
  :root { --bg:#14171c; --fg:#e6e6e6; --val:#cfd6dd; --dim:#9aa3ad; --line:#2b313a; --werk:#8fbc8f; --wacht:#e8d27a; --mens:#f0a060; --acc:#6fb3ff; --rood:#ff6b6b; }
  body { margin:0; background:var(--bg); color:var(--val); font:15px/1.5 system-ui, Segoe UI, sans-serif; }
  main { max-width:1500px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:24px; margin:0 0 4px; color:var(--fg); } h2 { font-size:22px; margin:28px 0 10px; color:var(--fg); }
  .sub { color:var(--dim); font-size:14px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--val); font-weight:600; font-size:14px; vertical-align:bottom; }
  th .leg { display:block; font-weight:400; font-size:13px; color:var(--dim); margin-top:4px; white-space:normal; }
  a, .link { color:var(--acc); cursor:pointer; text-decoration:none; } a:hover, .link:hover { text-decoration:underline; }
  /* balk */
  .bar { display:flex; width:400px; max-width:100%; height:18px; border-radius:4px; overflow:hidden; background:#222; }
  .seg { height:100%; } .seg.werk { background:var(--werk); } .seg.mens { background:var(--mens); }
  .seg.wacht, .tl-blok.wacht, .sw.wacht { background:repeating-linear-gradient(45deg, var(--wacht) 0 6px, #b8a45a 6px 8px); }
  .pct { color:var(--val); font-size:14px; margin-top:3px; white-space:nowrap; }
  .uren { color:var(--val); font-size:14px; }
  .dim { color:var(--dim); }
  .sw { display:inline-block; width:14px; height:12px; border-radius:2px; vertical-align:middle; margin:0 4px 0 0; }
  .sw.werk { background:var(--werk); } .sw.mens { background:var(--mens); }
  /* chips: tint per type + letter */
  .chip { --c:154,163,173; display:inline-block; margin:2px 4px 2px 0; padding:1px 10px 1px 4px; border-radius:10px; font-size:14px; background:rgba(var(--c),.18); color:var(--fg); cursor:pointer; white-space:nowrap; }
  .chip:hover { background:rgba(var(--c),.32); }
  .chip b.t, .tb b.t { display:inline-block; min-width:18px; text-align:center; margin-right:5px; padding:0 3px; border-radius:8px; background:rgba(var(--c),.85); color:#10141a; font-size:12px; font-weight:700; }
  .systeem { --c:90,169,255; } .data { --c:45,212,191; } .recht { --c:180,140,255; } .proces { --c:255,126,182; } .mens { --c:225,230,236; } .tool { --c:154,163,173; }
  .tb { --c:154,163,173; display:inline-block; margin-right:8px; font-size:14px; white-space:nowrap; } .tb b.t { min-width:0; padding:0 7px; }
  .typleg { display:block; margin-top:4px; } .typleg .tb { font-weight:400; margin-right:6px; }
  select { background:#222; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:2px 4px; }
  .score { font-variant-numeric:tabular-nums; }
  .waarsch { color:var(--rood); font-size:14px; }
  /* KPI */
  .kpi-groot { font-size:30px; line-height:1.25; color:var(--fg); font-weight:600; padding:14px 18px; border:1px solid var(--rood); border-left:8px solid var(--rood); border-radius:6px; background:#201518; margin:6px 0 18px; }
  .kpi-groot b { color:var(--rood); }
  .kpi-groot .klein { display:block; font-size:14px; font-weight:400; color:var(--dim); }
  .groot { font-size:28px; font-weight:700; color:var(--rood); font-variant-numeric:tabular-nums; }
  .groot.nul { color:var(--dim); font-weight:400; }
  .tegels { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; margin:12px 0; }
  .tegel { border:1px solid var(--line); border-radius:8px; padding:10px 14px; background:#111419; }
  .tegel { display:flex; gap:8px; align-items:baseline; } .tegel .n { font-size:16px; font-weight:600; color:var(--fg); } .tegel .l { font-size:15px; color:var(--dim); }
  .tegel.rood { border-color:var(--rood); } .tegel.rood .n { color:var(--rood); }
  /* tabel enkel-punt */
  tr.enkel td:first-child { border-left:6px solid var(--rood); }
  .badge-rood { display:inline-block; background:var(--rood); color:#1a0d0d; font-weight:700; font-size:14px; border-radius:4px; padding:1px 8px; white-space:nowrap; }
  /* tijdlijn */
  .tl { border:1px solid var(--line); border-radius:6px; padding:8px; background:#111419; }
  .tl-rij { display:flex; align-items:center; height:28px; } .tl-wie { width:130px; color:var(--val); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:6px; }
  .tl-spoor { position:relative; flex:1; height:20px; background:#1c2129; border-radius:3px; }
  .tl-blok { position:absolute; top:0; height:100%; border-radius:3px; font-size:13px; color:#111; text-align:center; line-height:20px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .tl-blok.werk { background:var(--werk); } .tl-blok.mens { background:var(--mens); }
  .tl-as { display:flex; margin-top:2px; } .tl-as .sp { width:130px; } .tl-as .as { position:relative; flex:1; height:20px; border-top:1px solid var(--line); color:var(--dim); font-size:13px; }
  .tl-as .as span { position:absolute; top:2px; transform:translateX(-50%); white-space:nowrap; } .tl-as .as span:first-child { transform:none; } .tl-as .as span:last-child { transform:translateX(-100%); }
  .vk { display:inline-block; padding:2px 12px; border:1px solid var(--line); border-radius:12px; margin-right:6px; font-size:14px; } .vk.aan { border-color:var(--acc); background:#1d2a3a; }
  .legenda { font-size:14px; color:var(--val); margin:8px 0 0; }
  .panel { border:1px solid var(--line); border-radius:8px; padding:16px; margin-top:16px; background:#181c22; }
  .terug { font-size:14px; }
  .twee { display:grid; grid-template-columns:360px minmax(0,1fr); gap:28px; align-items:start; margin-top:8px; } .twee h2 { margin-top:8px; }
  .tekening { margin:0; } .tekening img { width:360px; max-width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:6px; cursor:zoom-in; }
  .tekening .hint { font-size:14px; color:var(--dim); margin-top:4px; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.92); overflow:auto; z-index:9; cursor:zoom-out; padding:24px; }
  .overlay img { display:block; margin:0 auto; max-width:none; width:1800px; } .overlay .sluit { position:fixed; top:12px; right:18px; color:var(--fg); font-size:15px; background:#243040; padding:6px 12px; border-radius:6px; }
  details { margin-top:16px; } summary { cursor:pointer; color:var(--fg); font-size:16px; font-weight:600; list-style:none; display:inline-block; padding:8px 14px; border:1px solid var(--acc); border-radius:6px; background:#1d2a3a; }
  summary::-webkit-details-marker { display:none; } summary::before { content:"\25B8  "; color:var(--acc); } details[open] summary::before { content:"\25BE  "; } summary .hint { font-weight:400; color:var(--dim); font-size:14px; margin-left:8px; }
  .stap { display:flex; gap:12px; padding:4px 0; border-bottom:1px dashed var(--line); } .stap .n { width:28px; color:var(--dim); } .stap .w { flex:1; } .stap .u { width:80px; text-align:right; color:var(--val); }
  footer { margin-top:32px; font-size:14px; color:var(--dim); }
</style>
</head>
<body>
<main>
  <h1 id="kop"></h1>
  <div class="sub" id="intro"></div>
  <div id="view"></div>
  <footer id="voet"></footer>
</main>
<script src="data/bord.js"></script>
<script>
// ---- taal: alle zichtbare UI-tekst staat hier; data (flow- en stapnamen) blijft zoals ingevuld ----
const TEKST = {

    afh: "afh.", alleen: "alleen", wachtOp: "wacht op", dag: "d", uur: "u", wachtSuffix: " wacht",

    legBalk: { werk: "werk (agent of script)", mens: "menselijke actie", wacht: "wachten" },
    versie: "Versie",
    wachtKop: "Wachttijd per externe partij", partij: "Partij", wachtStappen: "Wacht-stappen", wachtPerTicket: "Wachttijd per ticket", deelDoorloop: "Deel van doorlooptijd",
    geenControle: "Geen controle over deze tijd, wel tellen.",
    kpiVan: "van", kpiMid: "afhankelijkheden hebben één kenner:", kpiZonder: "zonder kenner",
    kpiKlein: "Valt die ene kenner weg, dan staat de flow stil. Een externe partij met één kenner telt mee.",
    thPrio: "Prio", thFlow: "Flow", thDoorloop: "Doorlooptijd",
    thLeunt: "Leunt op mij", thLeuntTitel: "aantal stromen dat deze stroom nodig heeft",
    thFreq: "Frequentie · FTE", thFreqTitel: "frequentie en FTE: frequentie x engineer-uren per keer + onderhoud, gedeeld door uren per FTE",
    thAfh: "Afhankelijkheden", thEnkel: "Enkel punt", thEnkelTitel: "aantal afhankelijkheden met precies één kenner",

    kopMensen: "Wie draagt het meeste", kopDeps: "Alle afhankelijkheden, enkel punt eerst",
    thEnigeKenner: "Enige kenner", thDepEen: "Afhankelijkheid", thStromenErop: "Stromen die erop leunen",
    thPersoon: "Persoon", thKentDeps: "Kent afhankelijkheden", thTaken: "Taken die op die kennis leunen", thFlowsErop: "Flows die erop leunen", thAlsEnige: "Waar als enige",
    mensSub: 'Veel flows op één persoon betekent flessenhals. "Waar als enige" is de lijst om als eerste te delen.',
    terug: "terug naar overzicht",
    mensSamenv: (d, s, z, naam) => `Kent <b>${d}</b> afhankelijkheden; <b>${s}</b> stromen leunen op die kennis; bij <b>${z}</b> is ${naam} de enige.`,
    kopKennis: "Kennis", thWieNog: "Wie nog meer", thStromen: "Stromen", kopStromenHierop: "Stromen die hierop leunen", thStroom: "Stroom",
    tegels: { doorloop: "doorlooptijd", wachten: "wachten", deps: "afhankelijkheden", een: "met één kenner" },
    kopTekening: "Tekening", kopDeps2: "Afhankelijkheden", kopTijdlijn: "Tijdlijn",
    heeftNodig: "Heeft nodig:", leuntOp: "Leunt op mij:",
    tekHint: "Tekening van de flow: klik voor groot.", geenTek: "Nog geen tekening voor deze stroom.",
    engineerPerKeer: u => `engineer ${u} u per keer`, bronUren: "bron van de uren", BronUren: "Bron van de uren",
    stappen: "Stappen", uitklappen: "klik om uit te klappen",
    kennisBij: "Kennis bij:", leuntEen: "stroom leunt", leuntMeer: "stromen leunen", valtWeg: "hierop. Valt dit weg, dan staan deze stil:"
  },
  en: {
    titel: "Flow overview",
    intro: "One row per flow; click a flow for its drawing, click a dependency to see who relies on it.",
    voet: v => `Flow board v${v}. <a href="README.md">How to fill it in and data model</a>. The "Relied on by" counts, FTE and knowledge holders are computed from the JSON files.`,
    sluiten: "close (click or Esc)", tekeningGroot: "drawing, enlarged", tekeningVan: "drawing",
    niemand: "nobody", niemandTitel: "nobody officially: someone has to jump into this gap",
    afh: "deps", alleen: "only", wachtOp: "waiting for", dag: "d", uur: "h", wachtSuffix: " waiting",
    meetpuntTelt: "counts as", meetpunt: "measure point", start: "start", eind: "end",
    soort: { wacht: "wait", werk: "work", mens: "human" },
    typen: { systeem: "system", data: "data", recht: "right", proces: "process", mens: "person", tool: "tool", onbekend: "unknown" },
    legBalk: { werk: "work (agent or script)", mens: "human action", wacht: "waiting" },
    versie: "Version",
    wachtKop: "Waiting time per external party", partij: "Party", wachtStappen: "Wait steps", wachtPerTicket: "Waiting time per ticket", deelDoorloop: "Share of lead time",
    geenControle: "No control over this time, but it is counted.",
    kpiVan: "of", kpiMid: "dependencies have a single expert:", kpiZonder: "without an expert",
    kpiKlein: "If that one expert drops out, the flow stops. An external party with one expert counts too.",
    thPrio: "Prio", thFlow: "Flow", thDoorloop: "Lead time",
    thLeunt: "Relied on by", thLeuntTitel: "number of streams that need this stream",
    thFreq: "Frequency · FTE", thFreqTitel: "frequency and FTE: frequency x engineer hours per run + maintenance, divided by hours per FTE",
    thAfh: "Dependencies", thEnkel: "Single point", thEnkelTitel: "number of dependencies with exactly one expert",
    thKennisBij: "Knowledge held by", thKennisBijTitel: "who knows the dependencies of this stream",
    kopMensen: "Who carries the most", kopDeps: "All dependencies, single points first",
    thEnigeKenner: "Only expert", thDepEen: "Dependency", thStromenErop: "Streams relying on it",
    thPersoon: "Person", thKentDeps: "Knows dependencies", thTaken: "Tasks relying on that knowledge", thFlowsErop: "Flows relying on it", thAlsEnige: "Where the only one",
    mensSub: 'Many flows on one person means a bottleneck. "Where the only one" is the list to share first.',
    terug: "back to overview",
    mensSamenv: (d, s, z, naam) => `Knows <b>${d}</b> dependencies; <b>${s}</b> streams rely on that knowledge; for <b>${z}</b> of them ${naam} is the only one.`,
    kopKennis: "Knowledge", thWieNog: "Who else", thStromen: "Streams", kopStromenHierop: "Streams relying on this", thStroom: "Stream",
    tegels: { doorloop: "lead time", wachten: "waiting", deps: "dependencies", een: "with one expert" },
    kopTekening: "Drawing", kopDeps2: "Dependencies", kopTijdlijn: "Timeline",
    heeftNodig: "Needs:", leuntOp: "Relied on by:",
    tekHint: "Drawing of the flow: click to enlarge.", geenTek: "No drawing for this stream yet.",
    engineerPerKeer: u => `engineer ${u} h per run`, bronUren: "source of the hours", BronUren: "Source of the hours",
    stappen: "Steps", uitklappen: "click to expand",
    kennisBij: "Knowledge held by:", leuntEen: "stream relies", leuntMeer: "streams rely", valtWeg: "on this. If it drops out, these stop:"
  }
};
const T = TEKST[(window.FLOW_BORD.config || {}).taal] || TEKST.nl;
const TITEL = (window.FLOW_BORD.config || {}).titel || T.titel;
document.documentElement.lang = (window.FLOW_BORD.config || {}).taal === "en" ? "en" : "nl";
document.title = TITEL;
document.getElementById("kop").textContent = TITEL;
document.getElementById("intro").textContent = T.intro;
document.getElementById("voet").innerHTML = T.voet(window.FLOW_BORD.versie || "?");

// ---- lezen ----
function openTekening(src) { const o = document.createElement("div"); o.className = "overlay"; o.innerHTML = `<span class="sluit">${T.sluiten}</span><img src="${src}" alt="${T.tekeningGroot}">`; o.onclick = () => o.remove(); document.body.appendChild(o); }
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".overlay").forEach(o => o.remove()); });
function getBord()               { return window.FLOW_BORD; }
function getStreams()            { return getBord().flows; }
function getDeps()               { return getBord().afhankelijkheden; }
function getDep(id)              { return getDeps().find(d => d.id === id) || { id, naam: id, type: "onbekend" }; }
function getStream(id)           { return getStreams().find(s => s.id === id); }
function getPrio(s)              { return s.prio === null ? 1e9 : s.prio; }
function getVersies(s)           { return s.versies; }
function getVersie(s)            { const v = getVersies(s); const k = (location.hash.match(/versie=([^&]+)/) || [])[1]; return v.find(x => x.versie === k) || v[0]; }
function getStappen(s)           { return getVersie(s).stappen; }
function getTotaalUren(s)        { return Math.round(getStappen(s).reduce((a, x) => a + x.uren, 0) * 100) / 100; }
function getNodigIds(s)          { return s.heeft_nodig.map(n => typeof n === "string" ? n : n.id); }
function getNodigWaarom(s, id)   { const n = s.heeft_nodig.find(x => typeof x !== "string" && x.id === id); return n ? n.waarom : ""; }
function getStreamsDieLeunenOp(id) { return getStreams().filter(s => getNodigIds(s).includes(id)); }
function getStreamsMetDep(depId) { return getStreams().filter(s => s.afhankelijkheden.includes(depId)); }
function getBelang(s)            { return getStreamsDieLeunenOp(s.id).length; }
function getMensen()             { return getBord().mensen; }
function getMens(id)             { return getMensen().find(m => m.id === id) || { id, naam: id, rol: "" }; }
function getDepsVanMens(id)      { return getDeps().filter(d => (d.kennis || []).includes(id)); }
function getStreamsVanMens(id)   { const ids = getDepsVanMens(id).map(d => d.id); return getStreams().filter(s => s.afhankelijkheden.some(a => ids.includes(a))); }
function getSpofsVanMens(id)     { return getEnkelPunten().filter(d => d.kennis[0] === id); }
function getMensenVanStream(s)   { const set = new Set(); s.afhankelijkheden.forEach(a => (getDep(a).kennis || []).forEach(m => set.add(m))); return [...set]; }
function isEnkel(d)              { return (d.kennis || []).length === 1; }              // precies één kenner
function getSpofsVanStream(s)    { return s.afhankelijkheden.map(getDep).filter(isEnkel); }
function getConfig()             { return getBord().config; }
function getPerJaar(s)           { if (!s.frequentie) return 0; const c = getConfig(); const f = { werkdag: c.werkdagen_per_jaar, week: c.werkweken_per_jaar, maand: c.maanden_per_jaar }[s.frequentie.per] || 1; return s.frequentie.aantal * f; }
function rond(u)                 { return Math.round(u * 100) / 100; }
function r1(u)                   { return Math.round(u * 10) / 10; }
function getMensUren(s, st)      { return rond((st || getStappen(s)).filter(x => x.soort === "mens").reduce((a, x) => a + x.uren, 0)); }
function getEngineerUren(s, st)  { const r = getConfig().fte_rollen; return rond((st || getStappen(s)).filter(x => x.soort === "mens" && r.includes(x.wie)).reduce((a, x) => a + x.uren, 0)); }
function getOnderhoudPerMaand(v) { return (v.onderhoud || {}).uren_per_maand || 0; }
function getOnderhoudPerJaar(v)  { return getOnderhoudPerMaand(v) * getConfig().maanden_per_jaar; }
function getFlowsMetDep(depId)   { return getStreamsMetDep(depId).filter(isFlow); }
function getDepAandeelPerJaar(s) { const m = getConfig().maanden_per_jaar; return s.afhankelijkheden.map(getDep).reduce((a, d) => { const u = (d.onderhoud || {}).uren_per_maand || 0; const n = getFlowsMetDep(d.id).length; return a + (u && n ? u * m / n : 0); }, 0); }
function getUrenPerJaar(s, v)    { v = v || getVersie(s); return getPerJaar(s) * getEngineerUren(s, v.stappen) + getOnderhoudPerJaar(v) + getDepAandeelPerJaar(s); }
function getFte(s, v)            { return getUrenPerJaar(s, v) / getConfig().uren_per_fte; }
function formatFte(f)            { return f > 0 ? f.toFixed(f < 0.1 ? 2 : 1) + " FTE" : "–"; }
function isFlow(s)               { return s.soort === "flow"; }
function formatUren(u)           { return u >= 16 ? r1(u / 8) + " " + T.dag : r1(u) + " " + T.uur; }
function formatGetal(n)          { return n > 0 ? r1(n) : "–"; }
function formatMeetpunt(m)       { return m ? m.systeem + ": " + m.veld + (m.telt_als ? "; " + T.meetpuntTelt + " " + m.telt_als : "") : ""; }
function getUrenVan(s, soort, st){ return (st || getStappen(s)).filter(x => x.soort === soort).reduce((a, x) => a + x.uren, 0); }
function getPct(s, soort)        { const t = getTotaalUren(s); return t ? Math.round(getUrenVan(s, soort) / t * 100) : 0; }
function getWieNaam(w)           { if (!w) return "?"; const m = getBord().mensen.find(x => x.id === w); if (m) return m.naam; const d = getDeps().find(x => x.id === w); return d ? d.naam.split(" (")[0] : w; }
function getExterneWacht(s)      { const per = {}; getStappen(s).filter(x => x.soort === "wacht" && getDep(x.wie).extern).forEach(x => { per[x.wie] = per[x.wie] || { dep: getDep(x.wie), uren: 0, stappen: 0 }; per[x.wie].uren += x.uren; per[x.wie].stappen++; }); return Object.values(per); }
// kennis-telling over alle afhankelijkheden die een stroom gebruikt (extern uitgezonderd: daar is geen eigen kenner te verwachten)
function getDepsInGebruik()      { return getDeps().filter(d => getStreamsMetDep(d.id).length > 0); }
function getEnkelPunten()        { return getDepsInGebruik().filter(isEnkel); }               // één definitie: precies één kenner, ook extern
function getZonderKenner()       { return getDepsInGebruik().filter(d => (d.kennis || []).length === 0); }
const TYPES = [["systeem", "S"], ["data", "D"], ["recht", "R"], ["proces", "P"], ["mens", "M"], ["tool", "T"]];
function typeLetter(t)           { const x = TYPES.find(y => y[0] === t); return x ? x[1] : "?"; }

// ---- bouwstenen ----
function buildBar(s) {
  const tot = getTotaalUren(s);
  const segs = getStappen(s).map(x => `<div class="seg ${x.soort}" style="width:${(x.uren / tot * 100).toFixed(1)}%" title="${x.naam}: ${r1(x.uren)} ${T.uur}"></div>`).join("");
  return `<div class="bar">${segs}</div>`;
}
function buildBarMetPct(s) {
  const p = [["wacht", getPct(s, "wacht")], ["werk", getPct(s, "werk")], ["mens", getPct(s, "mens")]].filter(x => x[1] > 0);
  return buildBar(s) + `<div class="pct">${p.map(x => T.soort[x[0]] + " " + x[1] + "%").join(" · ")}</div>`;
}
function buildChip(d)  { return `<span class="chip ${d.type}" onclick="location.hash='dep=${d.id}'"><b class="t">${typeLetter(d.type)}</b>${d.naam.split(" (")[0]}</span>`; }
function buildChips(ids) { return ids.map(id => buildChip(getDep(id))).join(""); }
function buildMensChips(ids) {
  return ids.map(id => { const m = getMens(id); return `<span class="chip mens" onclick="location.hash='mens=${m.id}'"><b class="t">M</b>${m.naam}</span>`; }).join("") || `<span class="dim">${T.niemand}</span>`;
}
function buildTypeLegenda() {
  return `<span class="leg typleg">${TYPES.map(t => `<span class="tb ${t[0]}"><b class="t">${t[1]}</b>${T.typen[t[0]]}</span>`).join("")}</span>`;
}
function buildDepSamenvatting(s) {
  const deps = s.afhankelijkheden.map(getDep);
  const badges = TYPES.map(t => { const l = deps.filter(d => d.type === t[0]); return l.length ? `<span class="tb ${t[0]}" title="${l.map(d => d.naam.split(" (")[0]).join(", ")}"><b class="t">${t[1]}</b>${l.length}</span>` : ""; }).join("");
  return `<span class="uren">${deps.length} ${T.afh}</span> ${badges}`;
}
function buildKennisVanDep(d) {
  const k = d.kennis || [];
  if (k.length === 0) return `<span class="waarsch" title="${T.niemandTitel}">${T.niemand}</span>`;
  return buildMensChips(k);
}
function buildEnigeKenner(d) {
  const k = d.kennis || [];
  if (k.length === 1) return `<span class="badge-rood">${T.alleen} ${getMens(k[0]).naam}</span>`;
  if (k.length === 0) return `<span class="waarsch">${T.niemand}</span>`;
  return "";
}
function wieDienst(w) { return getWieNaam(w); }
function buildTijdlijn(s) {
  const st = getStappen(s), tot = getTotaalUren(s);
  const wies = [...new Set(st.map(x => x.wie || "?"))];
  let t = 0; const blokken = st.map((x, i) => { const b = { ...x, i, left: t / tot * 100, width: x.uren / tot * 100 }; t += x.uren; return b; });
  const label = b => b.soort === "wacht" ? (b.width > 12 ? T.wachtOp + " " + getWieNaam(b.wie) : "") : (b.width > 6 ? b.i + 1 : "");
  const rijen = wies.map(w => `<div class="tl-rij"><div class="tl-wie" title="${getWieNaam(w)}">${getWieNaam(w)}</div><div class="tl-spoor">${blokken.filter(b => (b.wie || "?") === w).map(b =>
    `<div class="tl-blok ${b.soort}" style="left:${b.left}%;width:${Math.max(b.width, 0.6)}%" title="${getWieNaam(b.wie)}: ${b.naam}, ${r1(b.uren)} u">${label(b)}</div>`).join("")}</div></div>`).join("");
  const as = [0, .25, .5, .75, 1].map(f => `<span style="left:${f * 100}%">${formatUren(tot * f)}</span>`).join("");
  return `<div class="tl">${rijen}<div class="tl-as"><div class="sp"></div><div class="as">${as}</div></div></div>`;
}
function buildLegendaBalk() {
  return `<span class="leg"><i class="sw werk"></i>${T.legBalk.werk} &nbsp; <i class="sw mens"></i>${T.legBalk.mens} &nbsp; <i class="sw wacht"></i>${T.legBalk.wacht}</span>`;
}
function buildVersieKnoppen(s) {
  const v = getVersies(s); if (v.length < 2) return "";
  return `<p>${T.versie}: ${v.map(x => `<a href="#stroom=${s.id}&versie=${x.versie}" class="${getVersie(s).versie === x.versie ? "vk aan" : "vk"}">${x.versie} ${x.naam} · ${formatUren(x.stappen.reduce((a, y) => a + y.uren, 0))}</a>`).join(" ")}</p>`;
}
function buildPrio(s) { return s.prio === null ? "–" : `<b>${s.prio}</b>`; }
function buildExterneWacht(s) {
  const rijen = getExterneWacht(s); if (!rijen.length) return "";
  const tot = getTotaalUren(s);
  const body = rijen.map(r => `<tr><td>${buildChip(r.dep)}</td><td class="score">${r.stappen}</td><td class="score">${formatUren(r.uren)}</td><td class="score">${Math.round(r.uren / tot * 100)}%</td></tr>`).join("");
  return `<h2>${T.wachtKop}</h2><table><thead><tr><th>${T.partij}</th><th>${T.wachtStappen}</th><th>${T.wachtPerTicket}</th><th>${T.deelDoorloop}</th></tr></thead><tbody>${body}</tbody></table><p class="sub">${T.geenControle}</p>`;
}
function buildStapRegel(x, i) {
  const meta = [x.start ? T.start + ": " + x.start : "", x.eind ? T.eind + ": " + x.eind : "", x.meetpunt ? T.meetpunt + ": <b>" + formatMeetpunt(x.meetpunt) + "</b>" : ""].filter(Boolean).join(" &nbsp;|&nbsp; ");
  return `<div class="stap"><span class="n">${i + 1}</span><span class="w">${x.naam}${x.wie ? " <span class='dim'>(" + getWieNaam(x.wie) + ")</span>" : ""}${x.afhankelijkheden && x.afhankelijkheden.length ? " " + buildChips(x.afhankelijkheden) : ""}${meta ? "<div class='uren'>" + meta + "</div>" : ""}</span><span class="u">${formatUren(x.uren)}${x.soort === "wacht" ? T.wachtSuffix : ""}</span></div>`;
}

// ---- schermen ----
function renderKpi() {
  const deps = getDepsInGebruik(), enkel = getEnkelPunten(), zonder = getZonderKenner();
  const per = getMensen().map(m => [m.naam, enkel.filter(d => d.kennis[0] === m.id).length]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  return `<div class="kpi-groot"><b>${enkel.length} ${T.kpiVan} ${deps.length}</b> ${T.kpiMid} ${per.map(x => x[0] + " <b>" + x[1] + "</b>").join(", ") || T.niemand}${zonder.length ? ", +" + zonder.length + " " + T.kpiZonder : ""}<span class="klein">${T.kpiKlein}</span></div>`;
}
function renderOverview() {
  const streams = [...getStreams()].sort((a, b) => getPrio(a) - getPrio(b));
  const toonBelang = streams.some(s => getBelang(s) > 0);
  const rows = streams.map(s => { const n = getSpofsVanStream(s).length; return `
    <tr>
      <td class="score">${buildPrio(s)}</td>
      <td><span class="link" onclick="location.hash='stroom=${s.id}'"><b>${s.id}</b> ${s.naam}</span><div class="dim" style="font-size:14px">${s.groep}</div></td>
      <td>${buildBarMetPct(s)}</td>
      <td class="uren" style="white-space:nowrap">${formatUren(getTotaalUren(s))}</td>
      ${toonBelang ? `<td class="score">${getBelang(s) || "–"}</td>` : ""}
      <td class="uren">${isFlow(s) ? `${s.frequentie.aantal}/${s.frequentie.per} · <b>${formatFte(getFte(s))}</b>` : "–"}</td>
      <td>${buildDepSamenvatting(s)}</td>
      <td class="score"><span class="groot${n ? "" : " nul"}">${n || "–"}</span></td>
      <td>${buildMensChips(getMensenVanStream(s))}</td>
    </tr>`; }).join("");
  return `${renderKpi()}
    <table><thead><tr><th>${T.thPrio}</th><th>${T.thFlow}</th><th>${T.thDoorloop}${buildLegendaBalk()}</th><th></th>${toonBelang ? `<th title="${T.thLeuntTitel}">${T.thLeunt}</th>` : ""}<th title="${T.thFreqTitel}">${T.thFreq}</th><th>${T.thAfh}${buildTypeLegenda()}</th><th title="${T.thEnkelTitel}">${T.thEnkel}</th><th title="${T.thKennisBijTitel}">${T.thKennisBij}</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>${T.kopMensen}</h2>${renderMensRanking()}
    <h2>${T.kopDeps}</h2>${renderDepRanking()}`;
}
function renderDepRanking() {
  const rows = getDeps().map(d => ({ d, n: getStreamsMetDep(d.id).length })).filter(x => x.n > 0)
    .sort((a, b) => (isEnkel(b.d) - isEnkel(a.d)) || b.n - a.n)
    .map(x => `<tr class="${isEnkel(x.d) ? "enkel" : ""}"><td>${buildEnigeKenner(x.d)}</td><td>${buildChip(x.d)}</td><td class="score">${x.n}</td><td>${buildKennisVanDep(x.d)}</td></tr>`).join("");
  return `<table><thead><tr><th>${T.thEnigeKenner}</th><th>${T.thDepEen}${buildTypeLegenda()}</th><th>${T.thStromenErop}</th><th>${T.thKennisBij}</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function renderMensRanking() {
  const lijst = getMensen().map(m => { const st = getStreamsVanMens(m.id); return { m, deps: getDepsVanMens(m.id).length, taken: st.filter(s => !isFlow(s)).length, flows: st.filter(isFlow).length, spof: getSpofsVanMens(m.id).length }; })
    .filter(x => x.deps > 0).sort((a, b) => b.spof - a.spof || (b.taken + b.flows) - (a.taken + a.flows));
  const toonTaken = lijst.some(x => x.taken > 0);
  const rows = lijst.map(x => `<tr><td>${buildMensChips([x.m.id])} <span class="dim">${x.m.rol}</span></td><td class="score">${x.deps}</td>${toonTaken ? `<td class="score">${x.taken}</td>` : ""}<td class="score">${x.flows}</td><td class="score"><span class="groot${x.spof ? "" : " nul"}">${x.spof || "–"}</span></td></tr>`).join("");
  return `<table><thead><tr><th>${T.thPersoon}</th><th>${T.thKentDeps}</th>${toonTaken ? `<th>${T.thTaken}</th>` : ""}<th>${T.thFlowsErop}</th><th>${T.thAlsEnige}</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="sub">${T.mensSub}</p>`;
}
function renderMens(id) {
  const m = getMens(id); const deps = getDepsVanMens(id); const streams = getStreamsVanMens(id);
  const depRows = deps.map(d => `<tr class="${d.kennis.length === 1 ? "enkel" : ""}"><td>${buildChip(d)}</td><td>${d.kennis.length === 1 ? '<span class="badge-rood">' + T.alleen + " " + m.naam + '</span>' : buildMensChips(d.kennis.filter(k => k !== id))}</td><td class="score">${getStreamsMetDep(d.id).length}</td></tr>`).join("");
  const strRows = streams.map(s => `<tr><td><span class="link" onclick="location.hash='stroom=${s.id}'"><b>${s.id}</b> ${s.naam}</span></td><td>${s.prio ?? "–"}</td><td>${buildBarMetPct(s)}</td></tr>`).join("");
  return `<div class="panel"><a class="terug" href="#">&larr; ${T.terug}</a>
    <h2>${m.naam} <span class="dim">${m.rol}</span></h2>
    <p>${T.mensSamenv(deps.length, streams.length, getSpofsVanMens(id).length, m.naam)}</p>
    <h2>${T.kopKennis}</h2><table><thead><tr><th>${T.thDepEen}</th><th>${T.thWieNog}</th><th>${T.thStromen}</th></tr></thead><tbody>${depRows}</tbody></table>
    <h2>${T.kopStromenHierop}</h2><table><thead><tr><th>${T.thStroom}</th><th>${T.thPrio}</th><th>${T.thDoorloop}</th></tr></thead><tbody>${strRows}</tbody></table></div>`;
}
function buildTegels(s) {
  const tot = getTotaalUren(s), n = getSpofsVanStream(s).length;
  const t = [[formatUren(tot), T.tegels.doorloop, ""], [getPct(s, "wacht") + "%", T.tegels.wachten, ""], [s.afhankelijkheden.length, T.tegels.deps, ""], [n || "0", T.tegels.een, n ? "rood" : ""]];
  return `<div class="tegels">${t.map(x => `<div class="tegel ${x[2]}"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join("")}</div>`;
}
function renderStream(id) {
  const s = getStream(id); if (!s) return renderOverview();
  const stappen = getStappen(s).map(buildStapRegel).join("");
  const nodigIds = getNodigIds(s), leuntLijst = getStreamsDieLeunenOp(s.id);
  const nodig = nodigIds.length ? `<b>${T.heeftNodig}</b> ${nodigIds.map(n => `<span class="link" onclick="location.hash='stroom=${n}'">${n} ${getStream(n).naam}</span>${getNodigWaarom(s, n) ? " <span class='dim'>(" + getNodigWaarom(s, n) + ")</span>" : ""}`).join(", ")}<br>` : "";
  const leunt = leuntLijst.length ? `<b>${T.leuntOp}</b> ${leuntLijst.map(x => `<span class="link" onclick="location.hash='stroom=${x.id}'">${x.id} ${x.naam}</span>`).join(", ")}` : "";
  const tek = s.tekening ? `<div class="tekening"><img src="${s.tekening}" alt="${T.tekeningVan} ${s.id}" onclick="openTekening('${s.tekening}')"><div class="hint">${T.tekHint}</div></div>` : `<p class="sub">${T.geenTek}</p>`;
  const extra = isFlow(s) ? [T.engineerPerKeer(formatGetal(getEngineerUren(s))), formatFte(getFte(s))].filter(x => !x.includes("–")).join(" · ") : "";
  return `<div class="panel"><a class="terug" href="#">&larr; ${T.terug}</a>
    <h2 style="margin-top:8px">${s.id} ${s.naam}</h2><p>${s.doel}</p>
    ${buildTegels(s)}${buildVersieKnoppen(s)}
    <div class="twee">
      <div><h2>${T.kopTekening}</h2>${tek}</div>
      <div><h2>${T.kopDeps2}</h2><p>${buildChips(s.afhankelijkheden)}</p><div class="legenda">${buildTypeLegenda()}</div>
        ${nodig || leunt ? `<p>${nodig}${leunt}</p>` : ""}
        ${buildExterneWacht(s)}
        <h2>${T.kopTijdlijn}</h2>${buildTijdlijn(s)}<div class="legenda">${buildLegendaBalk()}</div>
        ${extra ? `<p class="sub">${extra} · ${T.bronUren}: ${getVersie(s).bron}</p>` : `<p class="sub">${T.BronUren}: ${getVersie(s).bron}</p>`}</div>
    </div>
    <details><summary>${T.stappen} (${getStappen(s).length})<span class="hint">${T.uitklappen}</span></summary>${stappen}</details></div>`;
}
function renderDep(id) {
  const d = getDep(id); const lijst = getStreamsMetDep(id);
  const rows = lijst.map(s => `<tr><td><span class="link" onclick="location.hash='stroom=${s.id}'"><b>${s.id}</b> ${s.naam}</span></td><td>${s.prio ?? "–"}</td><td>${buildBarMetPct(s)}</td></tr>`).join("");
  return `<div class="panel"><a class="terug" href="#">&larr; ${T.terug}</a>
    <h2>${d.naam} <span class="dim">(${T.typen[d.type] || d.type})</span></h2>
    <p><b>${T.kennisBij}</b> ${buildEnigeKenner(d)} ${buildKennisVanDep(d)}</p>
    <p><b>${lijst.length}</b> ${lijst.length === 1 ? T.leuntEen : T.leuntMeer} ${T.valtWeg}</p>
    <table><thead><tr><th>${T.thStroom}</th><th>${T.thPrio}</th><th>${T.thDoorloop}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---- route ----
function renderRoute() {
  const h = location.hash.replace("#", "");
  const [k, v] = h.split("&")[0].split("=");
  const view = document.getElementById("view");
  view.innerHTML = k === "stroom" ? renderStream(v) : k === "dep" ? renderDep(v) : k === "mens" ? renderMens(v) : renderOverview();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", renderRoute);
renderRoute();
</script>
</body>
</html>
