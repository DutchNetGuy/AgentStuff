<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root{ --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e;
    --heading:#79c0ff; --ltr:#ffa657; --dig:#d2a8ff; --kw:#e5c07b; --question:#d29922; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.6;}
  .wrap{max-width:62ch;margin:0 auto;padding:2.5rem 1.5rem 4rem;}
  img{max-width:100%;height:auto;cursor:zoom-in;}
  /* wide screens: the page grows for diagrams and tables, running text stays at 62ch */
  @media (min-width:1100px){
    .wrap{max-width:min(94vw,1500px);}
    .wrap p,.wrap ul,.wrap ol,.wrap .question,.wrap .meta,.wrap footer{max-width:62ch;}
  }
  h1{color:var(--heading);font-size:1.8rem;margin:0 0 .25rem;}
  h2{color:var(--heading);font-size:1.25rem;margin:2.2rem 0 .6rem;
     padding-bottom:.3rem;border-bottom:1px solid var(--border);}
  .meta{color:var(--muted);font-size:.85rem;margin-bottom:2rem;}
  p{margin:0 0 1.1rem;}
  /* .kw: one key word per paragraph, used sparingly */
  .kw{color:var(--kw);font-weight:600;}
  /* .id: identifiers (hostnames, ticket keys, hashes); monospace, slashed zero,
     digits and letters coloured by the script at the bottom of the page */
  .id{font-family:SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
      font-variant-numeric:slashed-zero;font-size:.95em;letter-spacing:.03em;}
  .id .dig{color:var(--dig);font-weight:600;}
  .id .ltr{color:var(--ltr);}
  code{font-family:SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;font-variant-numeric:slashed-zero;
    background:rgba(139,148,158,.15);padding:.06em .4em;border-radius:4px;font-size:.9em;}
  pre{background:var(--panel);border:1px solid var(--border);border-radius:6px;
    padding:1rem 1.1rem;overflow-x:auto;}
  pre code{background:none;padding:0;}
  table{width:100%;border-collapse:collapse;margin:1.2rem 0;font-size:.95rem;}
  th,td{text-align:left;padding:.5rem .7rem;border:1px solid var(--border);vertical-align:top;}
  th{background:var(--panel);}
  /* .question: a block that asks the reader something; the label is added by CSS */
  .question{background:rgba(210,153,34,.08);border-left:3px solid var(--question);
    border-radius:6px;padding:.7rem 1rem;margin:1.3rem 0;}
  .question::before{content:"QUESTION";display:block;color:var(--question);font-size:.75rem;
    font-weight:700;letter-spacing:.08em;margin-bottom:.2rem;}
  footer{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--border);
    color:var(--muted);font-size:.82rem;}
</style>
</head>
<body>
<div class="wrap">
  <h1>{{TITLE}}</h1>
  <div class="meta">Generated {{DATE}}</div>
  {{BODY}}
  <footer>Generated by cockpit · self-contained page</footer>
</div>
<script>
  // Every image opens as a bare file in a new tab, so it can be zoomed freely.
  document.querySelectorAll('.wrap img').forEach(function(img){
    if (img.closest('a')) { return; }
    var link = document.createElement('a');
    link.href = img.src; link.target = '_blank'; link.rel = 'noopener';
    img.parentNode.insertBefore(link, img); link.appendChild(img);
  });
  // Split each .id into digit and letter runs so they can be coloured. Built from DOM nodes,
  // not markup, so characters like < or & in an identifier stay plain text.
  document.querySelectorAll('.id').forEach(function(el){
    var parts = el.textContent.split(/([0-9]+|[A-Za-z]+)/);
    el.textContent = '';
    parts.forEach(function(p){
      if (!p) { return; }
      if (/^[0-9]+$/.test(p) || /^[A-Za-z]+$/.test(p)) {
        var s = document.createElement('span');
        s.className = /^[0-9]/.test(p) ? 'dig' : 'ltr';
        s.textContent = p;
        el.appendChild(s);
      } else {
        el.appendChild(document.createTextNode(p));
      }
    });
  });
</script>
</body>
</html>
