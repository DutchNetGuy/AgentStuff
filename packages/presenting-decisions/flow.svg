<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-label="What happens when an agent presents a decision with presenting-decisions" style="max-width:100%;height:auto;color:#e6e6e6;font-family:system-ui,sans-serif"><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e06666"/></marker></defs><rect x="0" y="0" width="800" height="490" fill="#111"/><rect x="20" y="70" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="100.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Open decision</text><text x="100.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">for the owner</text><text x="100.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">comes up</text><rect x="220" y="70" width="160" height="56" rx="10" fill="#d6a92b" fill-opacity="0.16" stroke="#d6a92b" stroke-width="1.6"/><text x="300.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Wait until all</text><text x="300.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">data is in</text><text x="300.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">one decision moment</text><rect x="420" y="70" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="500.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Build the table</text><text x="500.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">question, purpose,</text><text x="500.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">explanation, advice</text><rect x="620" y="70" width="160" height="56" rx="10" fill="#a07cc5" fill-opacity="0.16" stroke="#a07cc5" stroke-width="1.6"/><text x="700.0" y="86.0" text-anchor="middle" font-size="12" fill="currentColor">Too big for a row?</text><text x="700.0" y="102.0" text-anchor="middle" font-size="12" fill="currentColor">separate page</text><text x="700.0" y="118.0" text-anchor="middle" font-size="12" fill="currentColor">or a drawing</text><rect x="20" y="340" width="160" height="56" rx="10" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"/><text x="100.0" y="356.0" text-anchor="middle" font-size="12" fill="currentColor">Owner reads</text><text x="100.0" y="372.0" text-anchor="middle" font-size="12" fill="currentColor">only the table,</text><text x="100.0" y="388.0" text-anchor="middle" font-size="12" fill="currentColor">answers in one word</text><rect x="220" y="340" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="300.0" y="356.0" text-anchor="middle" font-size="12" fill="currentColor">Agent records</text><text x="300.0" y="372.0" text-anchor="middle" font-size="12" fill="currentColor">decision + reason</text><text x="300.0" y="388.0" text-anchor="middle" font-size="12" fill="currentColor">on the ticket</text><rect x="420" y="340" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6"/><text x="500.0" y="356.0" text-anchor="middle" font-size="12" fill="currentColor">Later: &quot;#3 is still</text><text x="500.0" y="372.0" text-anchor="middle" font-size="12" fill="currentColor">open&quot;, numbering</text><text x="500.0" y="388.0" text-anchor="middle" font-size="12" fill="currentColor">never restarts</text><rect x="620" y="340" width="160" height="56" rx="10" fill="#e06666" fill-opacity="0.16" stroke="#e06666" stroke-width="1.6"/><text x="700.0" y="356.0" text-anchor="middle" font-size="12" fill="currentColor">Without this skill:</text><text x="700.0" y="372.0" text-anchor="middle" font-size="12" fill="currentColor">&quot;agree on hook X?&quot;</text><text x="700.0" y="388.0" text-anchor="middle" font-size="12" fill="currentColor">owner asks for context</text><polyline points="180,98.0 220,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="380,98.0 420,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="580,98.0 620,98.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="780,98.0 794,98.0 794,300 8,300 8,368.0 20,368.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="180,368.0 220,368.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="380,368.0 420,368.0" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ma)"/><polyline points="500.0,126 500.0,195" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ma)"/><rect x="420" y="195" width="160" height="56" rx="10" fill="#4caf6e" fill-opacity="0.16" stroke="#4caf6e" stroke-width="1.6" stroke-dasharray="5 4"/><text x="500.0" y="211.0" text-anchor="middle" font-size="12" fill="currentColor">each row self-contained:</text><text x="500.0" y="227.0" text-anchor="middle" font-size="12" fill="currentColor">ref + title + one line,</text><text x="500.0" y="243.0" text-anchor="middle" font-size="12" fill="currentColor">jargon defined, data shown</text><polyline points="700.0,126 700.0,195" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ma)"/><rect x="620" y="195" width="160" height="56" rx="10" fill="#a07cc5" fill-opacity="0.16" stroke="#a07cc5" stroke-width="1.6" stroke-dasharray="5 4"/><text x="700.0" y="211.0" text-anchor="middle" font-size="12" fill="currentColor">options in their</text><text x="700.0" y="227.0" text-anchor="middle" font-size="12" fill="currentColor">own table:</text><text x="700.0" y="243.0" text-anchor="middle" font-size="12" fill="currentColor">option, what, pro, con</text><text x="500.0" y="267" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">advice names the action, never &quot;agree&quot;</text><text x="700.0" y="414" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">twice per session, before</text><text x="700.0" y="428" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">the owner can decide anything</text><rect x="20" y="455" width="14" height="14" rx="3" fill="#5b9bd5" fill-opacity="0.3" stroke="#5b9bd5"/><text x="40" y="466" font-size="11" fill="currentColor">owner</text><rect x="83.0" y="455" width="14" height="14" rx="3" fill="#4caf6e" fill-opacity="0.3" stroke="#4caf6e"/><text x="103.0" y="466" font-size="11" fill="currentColor">agent</text><rect x="146.0" y="455" width="14" height="14" rx="3" fill="#d6a92b" fill-opacity="0.3" stroke="#d6a92b"/><text x="166.0" y="466" font-size="11" fill="currentColor">waiting</text><rect x="222.2" y="455" width="14" height="14" rx="3" fill="#a07cc5" fill-opacity="0.3" stroke="#a07cc5"/><text x="242.2" y="466" font-size="11" fill="currentColor">tracker or page</text><rect x="351.2" y="455" width="14" height="14" rx="3" fill="#e06666" fill-opacity="0.3" stroke="#e06666"/><text x="371.2" y="466" font-size="11" fill="currentColor">what it prevents</text><line x1="486.79999999999995" y1="462" x2="516.8" y2="462" stroke="currentColor" stroke-dasharray="5 4"/><text x="522.8" y="466" font-size="11" fill="currentColor">detail or depends on</text></svg>
